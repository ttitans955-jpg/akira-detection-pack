---
title: Known VPN Gateway Artifacts Spawning Interactive Processes
id: d8c4a1b7-19e2-4f55-90a4-2e5b6a7f8c01
status: experimental
description: Detects a recognized attack chain of Akira initial access - an exposed or previously-compromised VPN/edge gateway spawning an interactive shell, cmd, or PowerShell. Covers the widely observed SonicWall SSL VPN launch vector.
references:
    - https://redcanary.com/blog/akira-ransomware/
    - https://attack.mitre.org/techniques/T1078/001/
author: "Threat Intel Portfolio (bikini-lambda session)"
date: 2026/09/07
modified: 2026/09/07
tags:
    - attack.initial_access
    - attack.t1078.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_gateways:
        ParentImage|endswith:
            - '\GetVPNC.exe'
            - '\sslvpnagent.exe'
            - '\SonicWallNetExtender.exe'
    selection_shells:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection_gateways and selection_shells
falsepositives:
    - VPN vendor support/automation scripts invoking shells from the gateway service
fields:
    - ParentImage
    - Image
    - CommandLine
    - User
level: high